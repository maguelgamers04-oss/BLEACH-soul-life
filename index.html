function safeSpawn(x,y){
 const m=MP[cur];
 const insideExit=(px,py)=>m.ex.some(p=>px>p[0]*T-8&&px<(p[0]+2)*T+8&&py>p[1]*T-8&&py<(p[1]+2)*T+8);
 if(free(x,y,8)&&!insideExit(x,y))return[cl(x,12,m.W-12),cl(y,12,m.H-12)];
 for(let r=1;r<=12;r++){
  for(let oy=-r;oy<=r;oy++)for(let ox=-r;ox<=r;ox++){
   if(Math.max(Math.abs(ox),Math.abs(oy))!==r)continue;
   const px=cl(x+ox*T,12,m.W-12),py=cl(y+oy*T,12,m.H-12);
   if(free(px,py,8)&&!insideExit(px,py))return[px,py];
  }
 }
 // Fallback central, também validado contra colisões.
 for(let r=0;r<Math.max(m.w,m.h);r++){
  const px=cl(m.W/2+r*T/2,12,m.W-12),py=cl(m.H/2,12,m.H-12);
  if(free(px,py,8))return[px,py];
 }

}
